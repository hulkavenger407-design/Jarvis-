[project]
name = "chhaya-workspace"
version = "0.0.0"
description = "Chhaya Agent Factory Workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
    "plugins/*"
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "fastapi>=0.139.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "uvicorn>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/kernel/src"]
addopts = "-v  --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [".venv", "node_modules"]
mypy_path = "packages/kernel/src"
